name: CI
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # `check` = lint + typecheck + unit tests + i18n (docs/PHASE5.md section 3). Do not split it
      # back into separate steps: a new check added to `check` would silently skip CI.
      - run: npm run check
      - run: npm run build
      - run: npm run build:newtab
      # Zip first: `wxt zip` rebuilds, so budgets must measure the build the zips contain.
      - run: npm run zip
      - run: npm run zip:newtab
      - run: npm run budgets
      - uses: actions/upload-artifact@v4
        with:
          name: tabitat-zip
          path: .output/*.zip
      - uses: actions/upload-artifact@v4
        with:
          name: tabitat-newtab-zip
          path: .output-newtab/*.zip
